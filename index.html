<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>松下家 家系図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 1枚のキャンバスに全員を並べ、タップした人の詳細を下から出す。明るい配色で固定（黒背景にしない） */
:root {
  --bg: #f6f5f2; --surface: #ffffff; --ink: #1f1f1f; --muted: #6b6b6b; --line: #a9a59c; --soft: #f3f1ec;
  --accent: #4a5a6a; --flower: #8a5a7a; --deceased-bg: #ecebe7; --me: #2f6fb0; --me-bg: #eef4fb;
  --path: #c0602a; --path-bg: #fff3e8; --came: #2e7d4f; --came-bg: #e9f5ee;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif; line-height: 1.45; overflow: hidden; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { padding-block: 10px 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
h1 { font-size: 17px; margin: 0; font-weight: 600; }
/* 右上: 管理者用／使用者用。開いている方を塗る。リンクがない方は出さない */
header { position: relative; padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 150px) !important; }
.mode { position: absolute; top: 8px; right: max(12px, env(safe-area-inset-right, 0px)); display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; font-size: 12px; align-self: center; }
.mode a { padding: 5px 10px; color: var(--muted); text-decoration: none; background: var(--surface); white-space: nowrap; }
.mode a:not([href]) { cursor: default; }
.mode a[hidden] { display: none; }
body.mode-admin #toAdmin { background: var(--accent); color: #fff; }
body.mode-user #toUser { background: var(--came); color: #fff; }
body.mode-admin header { box-shadow: inset 0 3px 0 var(--accent); }
body.mode-user header { box-shadow: inset 0 3px 0 var(--came); }
.sub { color: var(--muted); font-size: 12px; min-width: 0; overflow-wrap: anywhere; }
.mini { font-size: 12px; padding: 3px 8px; }
#tally { font-size: 12px; color: var(--came); font-weight: 600; }
.bar { display: flex; gap: 6px; padding-block: 0 8px; align-items: center; flex-wrap: wrap; }
.searchwrap { position: relative; flex: 1 1 150px; min-width: 0; display: flex; }
input[type=search] { flex: 1; min-width: 0; padding: 9px 10px; font-size: 16px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
button, select { border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 8px 10px; border-radius: 8px; font-size: 15px; cursor: pointer; font-family: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--me); outline-offset: 1px; }
label.view { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
#view { max-width: 9.5em; }
#hits { position: absolute; z-index: 5; left: 0; right: 0; top: 100%; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; max-height: 50vh; overflow: auto; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
#hits div { padding: 10px 12px; border-bottom: 1px solid var(--soft); cursor: pointer; }
#hits small { color: var(--muted); margin-left: 6px; }

/* ---- 家系図キャンバス ---- */
#stage { position: relative; flex: 1; overflow: hidden; touch-action: none; background: var(--bg); }
#stage > svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.edge { fill: none; stroke: var(--line); stroke-width: 1.6; }
.wed { stroke: var(--line); stroke-width: 1.6; }
.edge.inlaw { stroke-dasharray: 5 4; }
.edge.hl, .wed.hl { stroke: var(--path); stroke-width: 3.2; }
.card rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.4; }
.card.dead rect { fill: var(--deceased-bg); }
.card.subject rect { stroke: var(--ink); stroke-width: 3; }
.card.viewer rect { stroke: var(--me); stroke-width: 3; fill: var(--me-bg); }
.card.came rect { fill: var(--came-bg); }
.card.onpath rect { stroke: var(--path); stroke-width: 3; }
.card.sel rect { fill: var(--path-bg); stroke: var(--path); stroke-width: 3.5; }
.card .nm { font-size: 14px; font-weight: 600; fill: var(--ink); }
.card .rel { font-size: 11px; fill: var(--accent); }
.card .tag { font-size: 10px; fill: var(--muted); }
.card .flw { font-size: 10px; fill: var(--flower); }
.card .ok { font-size: 10px; fill: var(--came); font-weight: 700; }
.legend { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: 12px; pointer-events: none;
  display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; max-width: calc(100% - 80px);
  font-size: 11px; color: var(--muted); background: rgba(246,245,242,.9); padding: 4px 8px; border-radius: 6px; }
.legend svg { overflow: visible; }
.zoom { position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 44px; height: 44px; padding: 0; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.zoom button.txt { font-size: 12px; }

/* ---- 一覧 ---- */
#list { flex: 1; overflow: auto; padding-block: 0 24px; display: none; }
#list table { border-collapse: collapse; width: 100%; background: var(--surface); font-size: 14px; }
#list td, #list th { border-bottom: 1px solid #e3e1dc; padding: 9px 6px; text-align: left; vertical-align: top; }
#list th { position: sticky; top: 0; background: var(--surface); font-size: 12px; color: var(--muted); }
#list tr { cursor: pointer; }
#list .yo { display: block; color: var(--muted); font-size: 12px; }
#list .ok { color: var(--came); font-weight: 700; }
body.listmode #stage { display: none; }
body.listmode #list { display: block; }

/* ---- 詳細シート ---- */
#sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface);
  border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.12);
  max-height: 60vh; overflow: auto; padding-block: 14px calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateY(105%); transition: transform .2s ease; }
#sheet.open { transform: none; }
#sheet .close { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: 10px; }
#sheet h2 { margin: 0 70px 0 0; font-size: 20px; }
#sheet .yo { color: var(--muted); font-size: 13px; }
.big { margin: 10px 0 2px; font-size: 13px; color: var(--muted); }
.big b { display: block; font-size: 20px; color: var(--path); }
.chain { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 8px 0; font-size: 14px; }
.chain span.p { background: var(--soft); border-radius: 6px; padding: 3px 7px; }
.chain span.p b { color: var(--path); font-weight: 600; margin-right: 3px; }
.chain .ar { color: var(--muted); }
.came { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 4px; }
.came button { flex: 1 1 8em; padding: 10px; font-weight: 600; }
.came button.on { background: var(--came); border-color: var(--came); color: #fff; }
.came .note { width: 100%; font-size: 12px; color: var(--muted); }
#sheet dl { display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 8px; margin: 10px 0 0; font-size: 14px; }
#sheet dt { color: var(--muted); }
#sheet dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.btnrow { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
@media (min-width: 900px) {
  #sheet { left: auto; right: 16px; bottom: 16px; width: 410px; border-radius: 14px; border: 1px solid var(--line); max-height: 80vh; }
}
@media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
.overlay { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow: auto; padding-block: 32px; }
.overlay .panel { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.overlay h2 { margin: 0; font-size: 20px; }
.overlay label { font-size: 18px; }
.overlay input { padding: 12px; font-size: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.overlay button[type=submit] { background: var(--accent); color: #fff; border-color: var(--accent); padding: 12px; font-size: 17px; }
.overlay .msg { color: var(--muted); font-size: 13px; margin: 0; }
#gateMsg { color: var(--path); }
#sched { z-index: 30; }
.schedhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.venue { margin: 6px 0 0; font-size: 15px; }
.day { margin-top: 14px; }
.day h3 { margin: 0 0 6px; font-size: 16px; color: var(--accent); }
.item { display: grid; grid-template-columns: 3.6em 1fr; gap: 2px 10px; padding: 10px 0; border-top: 1px solid #e3e1dc; }
.item .t { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 16px; }
.item .w { font-weight: 600; font-size: 16px; }
.item .n { grid-column: 2; color: var(--muted); font-size: 14px; }
.item.past { opacity: .5; }
.item.next .w::after { content: "次"; margin-left: 6px; font-size: 11px; color: #fff; background: var(--path); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; }
.tips { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tips h3 { margin: 0 0 6px; font-size: 15px; }
.tips ul { margin: 0; padding-left: 1.2em; font-size: 14px; display: grid; gap: 4px; }
#pickList { display: flex; flex-direction: column; gap: 6px; }
#pickList button { text-align: left; padding: 12px; font-size: 17px; display: flex; justify-content: space-between; gap: 8px; }
#pickList small { color: var(--muted); font-size: 12px; }
.ghost { background: transparent; color: var(--muted); }
.share-only { display: none !important; }
body.share .share-only { display: inline-block !important; }
body.share .private-only { display: none; }
body.export header, body.export .bar, body.export .zoom, body.export #sheet { display: none; }
</style>
</head>
<body>
<header class="gut">
  <h1>松下家 家系図</h1>
  <span class="sub" id="eventLine"></span>
  <span id="tally"></span>
  <button id="copyCame" class="mini" hidden>記録をコピー</button>
  <button id="lineCame" class="mini" hidden>LINEで送る</button>
  <nav class="mode" aria-label="表示の切り替え">
    <a id="toAdmin" target="_blank" rel="noopener">管理者用</a><a id="toUser" target="_blank" rel="noopener">使用者用</a>
  </nav>
</header>
<div class="bar gut">
  <div class="searchwrap">
    <input id="q" type="search" placeholder="名前・よみで探す" autocomplete="off">
    <div id="hits" hidden></div>
  </div>
  <label class="view">視点 <select id="view" aria-label="誰から見た続柄を出すか"></select></label>
  <button id="schedBtn">日程</button>
  <button id="pickerBtn" class="share-only">自分を選ぶ</button>
  <button id="modeBtn">一覧</button>
</div>
<div id="stage">
  <svg id="svg"><g id="vp"><g id="edges"></g><g id="cards"></g></g></svg>
  <div class="legend" aria-hidden="true">
    <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" class="edge"/></svg>親子
    <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" class="edge inlaw"/></svg>嫁・婿の実家
    <svg width="22" height="8"><line x1="0" y1="4" x2="22" y2="4" class="wed"/></svg>夫婦
  </div>
  <div class="zoom">
    <button data-z="1.25" aria-label="拡大">＋</button>
    <button data-z="0.8" aria-label="縮小">－</button>
    <button class="txt" id="meBtn">視点</button>
    <button class="txt" id="fitBtn">全体</button>
  </div>
</div>
<div id="list" class="gut"><table>
  <thead><tr><th>氏名</th><th id="relHead">続柄</th><th class="private-only">出欠</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<div id="sheet" class="gut" aria-live="polite"><button class="close" id="closeBtn">閉じる</button><div id="sheetBody"></div></div>

<div id="gate" class="overlay gut" hidden>
  <form id="gateForm" class="panel">
    <h2>家系図を開く</h2>
    <label for="gateA" id="gateQ"></label>
    <input id="gateA" type="text" inputmode="numeric" autocomplete="off" required>
    <button type="submit">開く</button>
    <p id="gateMsg" class="msg"></p>
    <button type="button" class="ghost" id="gateSched">通夜・告別式の日程だけ見る</button>
  </form>
</div>
<div id="sched" class="overlay gut" hidden>
  <div class="panel">
    <div class="schedhead"><h2 id="schedTitle">日程</h2><button id="schedClose">閉じる</button></div>
    <div id="schedBody"></div>
  </div>
</div>
<div id="picker" class="overlay gut" hidden>
  <div class="panel">
    <h2>あなたはどなたですか？</h2>
    <p class="msg">選ぶと、全員の続柄が「あなたから見て」で表示されます。あとで上の欄から変えられます。</p>
    <input id="pq" type="search" placeholder="名前・よみで探す" autocomplete="off">
    <div id="pickList"></div>
    <button id="pickSkip" class="ghost">選ばずに見る（故人から見た続柄）</button>
  </div>
</div>

/* ---------- レイアウト（夫婦を1つの箱にして dagre で配置） ---------- */

    const [a, b] = u.members, xa = px(a), xb = px(b);

function drawEdges() {

    }

  // 嫁・婿の実家からの線は点線にする（故人と血縁がなく、配偶者の側にも親が描かれている人）
  const blood = id => SUBJECT && !(REL[SUBJECT]?.[id]?.p || []).some(([, w]) => /夫|妻|配偶者/.test(w));
  // （故人の妻＝喪主の実家は、今回の主役の家なので実線のまま）
  const inlaw = c => { const sp = byId[c["配偶者"]]; return sp && sp.id !== SUBJECT && parentsOf(sp).length && !blood(c.id); };

    const gr = groups[key + (inlaw(c) ? "#in" : "")] ??= { u, cy, kids: [], inlaw: inlaw(c) };
    gr.kids.push(c);

  const byRow = {};
  Object.values(groups).forEach(gr => {
    gr.sx = gr.u.members.length === 2 ? gr.u.x : L.pos[gr.u.members[0]].x + W / 2;
    const xs = [gr.sx, ...gr.kids.map(c => L.pos[c.id].x + W / 2)];
    gr.x0 = Math.min(...xs); gr.x1 = Math.max(...xs);

// スマホ: タッチイベントを直接受けて preventDefault する（ブラウザやアプリ側のスクロールに指の動きを取られないように）
let touch = null; // {mode: "pan"|"pinch", x, y, d, moved, target}

const ptrs = new Map(); let downAt = null, moved = 0, pinch = null;

      `<button data-came="${esc(lab)}" class="${actual(id, lab) === "○" ? "on" : ""}">${esc(lab)}に${actual(id, lab) === "○" ? "来た ✓" : "来た"}</button>`).join("")}
      <div class="note">押すと受付の実績として記録します（もう一度押すと取り消し）</div></div>` : ""}
    <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${k === "出欠" ? v : esc(v)}</dd>`).join("")}</dl>
    ${VIEWERS.includes(id) && id !== VIEW ? `<div class="btnrow"><button id="asView">${SHARE && id !== SUBJECT ? "これは自分です" : "この人の視点で見る"}</button></div>` : ""}`;
  document.getElementById("asView")?.addEventListener("click", () => setView(id));
  document.querySelectorAll("[data-came]").forEach(b => b.onclick = () => toggleCame(id, b.dataset.came));
}
function select(id, recenter) {
  clearSel();
  SEL = id;
  const steps = relOf(VIEW, id).p;
  const onPath = new Set([VIEW, id, ...steps.map(s => s[0])]);
  document.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("onpath", onPath.has(c.dataset.id));
    c.classList.toggle("sel", c.dataset.id === id);
  });
  highlightPath(steps);
  renderSheet(id);
  document.getElementById("sheet").classList.add("open");
  if (recenter) centerOn(id, Math.max(S, 0.8));
}
document.getElementById("closeBtn").onclick = clearSel;

function setView(id) {
  VIEW = id; viewSel.value = id; store.set(SHARE ? "me" : "view", id);
  if (SHARE && id !== SUBJECT) ME = id;
  const sel = SEL;
  drawCards(); renderList();
  if (sel) select(sel); else centerOn(VIEW, Math.max(S, 0.8));
}
viewSel.addEventListener("change", () => setView(viewSel.value));

/* ---------- 検索・一覧 ---------- */
const norm = s => String(s || "").replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s/g, "");
const qEl = document.getElementById("q"), hits = document.getElementById("hits");
qEl.addEventListener("input", () => {
  const q = norm(qEl.value);
  const found = q ? PEOPLE.filter(p => [p["氏名"], p["よみ"], p["住まい"], p["勤務先・仕事"]].some(v => norm(v).includes(q))) : [];
  hits.hidden = !found.length;
  hits.innerHTML = found.slice(0, 12).map(p => `<div data-id="${p.id}">${esc(p["氏名"])}<small>${esc(relLabel(p.id))}</small></div>`).join("");
});
hits.addEventListener("click", e => {
  const d = e.target.closest("[data-id]"); if (!d) return;
  hits.hidden = true; qEl.value = ""; qEl.blur(); setMode(false); select(d.dataset.id, true);
});
function setMode(list) {
  document.body.classList.toggle("listmode", list);
  document.getElementById("modeBtn").textContent = list ? "家系図" : "一覧";
}
document.getElementById("modeBtn").onclick = () => setMode(!document.body.classList.contains("listmode"));
function renderList() {
  document.getElementById("relHead").textContent = (VIEW === ME ? "あなた" : VIEW === SUBJECT && SHARE ? "故人" : shortName(byId[VIEW])) + "から";
  document.getElementById("rows").innerHTML = PEOPLE.filter(p => p.id !== "ito").map(p => `
    <tr data-id="${p.id}"><td><b>${esc(p["氏名"])}</b><span class="yo">${esc(p["よみ"])}</span></td>
    <td>${esc(relLabel(p.id))}</td>
    ${SHARE ? "" : `<td>${attTags(p.id).map(t => t.ok ? `<span class="ok">${esc(t.t)}</span>` : esc(t.t)).join(" ")}</td>`}</tr>`).join("");
}
document.getElementById("rows").addEventListener("click", e => {
  const tr = e.target.closest("tr[data-id]"); if (!tr) return;
  setMode(false); select(tr.dataset.id, true);
});

/* ---------- 受付の「来た」記録（claude.ai の db。使えない所ではボタンを出さない） ---------- */
let DB = null;
// claude.ai 以外（GitHub 版の管理者用）では、この端末の中に記録する
const LOCAL = !SHARE && !!SEALED && !!EVENT;
const localKey = () => `came:${EVENT.key}`;
if (LOCAL) { try { CAME = JSON.parse(store.get(localKey()) || "{}"); } catch (e) { CAME = {}; } }
const attCol = () => DB.collection(`events/${EVENT.key}/att`);
function tally() {
  const el2 = document.getElementById("tally");
  if (!LABELS.length) return;
  el2.textContent = LABELS.map(lab => {
    const came = PEOPLE.filter(p => actual(p.id, lab) === "○").length;
    const planned = PEOPLE.filter(p => plan(p.id, lab) === "○").length;
    return `${lab} 来た${came}/予定${planned}`;
  }).join("　");
}
async function toggleCame(id, lab) {
  const cur = { ...(CAME[id] || {}) };
  if (cur[lab] === "○") delete cur[lab]; else cur[lab] = "○";
  CAME[id] = cur;
  refreshAfterCame(id);
  if (!DB) { store.set(localKey(), JSON.stringify(CAME)); return; }
  try { await attCol().doc(id).set({ ...cur, at: new Date().toISOString() }); }
  catch (e) { alertLine("記録できませんでした。電波を確認してもう一度押してください"); }
}
function alertLine(msg) {
  const n = document.querySelector(".came .note"); if (n) n.textContent = msg;
}
function refreshAfterCame(changedId) {
  const sel = SEL;
  drawCards(); renderList(); tally();
  if (sel) select(sel);
}
(async () => {
  if (!EVENT || !window.claude?.use) return;
  const db = await window.claude.use("db");
  if (!db) return;
  DB = db;
  attCol().onSnapshot(snap => {
    const next = {};
    snap.docs.forEach(d => { const v = { ...d.data() }; delete v.at; next[d.id] = v; });
    CAME = next;
    refreshAfterCame();
  }, () => {});
  if (SEL) renderSheet(SEL);
})();

/* 端末に保存した「来た」を、Claude に渡す文字としてコピーする */
const copyBtn = document.getElementById("copyCame"), lineBtn = document.getElementById("lineCame");
const cameText = () => {
  const recs = Object.fromEntries(Object.entries(CAME).filter(([, v]) => Object.keys(v).length));
  return "来た記録 " + JSON.stringify({ [EVENT.sheet]: recs });
};
if (LOCAL) {
  copyBtn.hidden = false;
  lineBtn.hidden = false;
  // LINE の送り先選択が開く。自分の Keep メモに送れば、PC の LINE からコピーできる
  lineBtn.onclick = () => { location.href = "https://line.me/R/share?text=" + encodeURIComponent(cameText()); };
  copyBtn.onclick = async () => {
    const text = cameText();
    try { await navigator.clipboard.writeText(text); copyBtn.textContent = "コピーしました"; }
    catch (e) { window.prompt("この文字をコピーして Claude に送ってください", text); }
    setTimeout(() => copyBtn.textContent = "記録をコピー", 2500);
  };
}

/* ---------- 起動 ---------- */
drawEdges(); drawCards(); renderList(); tally();
if (params.has("fit")) document.body.classList.add("export");
function initialView() {
  if (params.has("fit")) fitAll(); else centerOn(VIEW, innerWidth < 600 ? 0.85 : 1);
}
initialView();
requestAnimationFrame(() => {
  if (!touch && !downAt) initialView(); // 画面の大きさが決まってからもう一度合わせる
  if (params.get("select")) select(params.get("select"), !params.has("fit"));
});
addEventListener("resize", () => apply());

/* 共有版: 初めて開いた人には、自分の名前を選んでもらう */
document.getElementById("pickerBtn").onclick = openPicker;
if (SHARE && !store.get("me")) openPicker();
function openPicker() {
  const pk = document.getElementById("picker"), list = document.getElementById("pickList"), pq = document.getElementById("pq");
  const cands = VIEWERS.filter(id => byId[id] && id !== SUBJECT);
  const render = () => {
    const q = norm(pq.value);
    list.innerHTML = cands.filter(id => !q || norm(byId[id]["氏名"]).includes(q) || norm(byId[id]["よみ"]).includes(q))
      .map(id => `<button data-id="${id}">${esc(byId[id]["氏名"])}<small>${esc(byId[id]["系統"] || "")}</small></button>`).join("");
  };
  pq.value = ""; render(); pq.oninput = render;
  list.onclick = e => { const b = e.target.closest("[data-id]"); if (!b) return; pk.hidden = true; setView(b.dataset.id); };
  document.getElementById("pickSkip").onclick = () => { pk.hidden = true; setView(SUBJECT); };
  pk.hidden = false;
}
} // boot

/* ---------- 合言葉で開く（共有版） ---------- */
const normAnswer = s => String(s || "").normalize("NFKC").toLowerCase().replace(/\s/g, "")
  .replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unseal(answer) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(normAnswer(answer)), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SEALED.salt), iterations: SEALED.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(SEALED.iv) }, key, b64(SEALED.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
async function tryOpen(answer, quiet) {
  const msg = document.getElementById("gateMsg");
  if (!quiet) msg.textContent = "確認しています…";
  let D;
  try { D = await unseal(answer); }
  catch (e) { if (!quiet) msg.textContent = "違うようです。もう一度入れてください"; return; }
  store.set("answer", answer);
  document.getElementById("gate").hidden = true;
  boot(D);
}
/* ---------- 日程（#nittei で直接開く） ---------- */
function openSchedule() {
  if (!SCHEDULE) return;
  const e = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const now = new Date();
  // 時刻のある項目に日時を付け、過ぎたものは薄く、次のものに「次」を付ける
  let nextMarked = false;
  const items = SCHEDULE.days.flatMap(d => d.items.map(it => ({ d, it })));
  const when = ({ d, it }) => {
    const m = /(\d+)\/(\d+)/.exec(d.date), t = /(\d+):(\d+)/.exec(it.time || "");
    return m && t ? new Date(SCHEDULE.year, +m[1] - 1, +m[2], +t[1], +t[2]) : null;
  };
  const state = new Map();
  items.forEach(x => {
    const w = when(x); if (!w) return;
    if (w < now - 30 * 60 * 1000) state.set(x.it, "past");
    else if (!nextMarked) { state.set(x.it, "next"); nextMarked = true; }
  });
  document.getElementById("schedTitle").textContent = SCHEDULE.title;
  document.getElementById("schedBody").innerHTML =
    (SCHEDULE.venue ? `<p class="venue">会場: <b>${e(SCHEDULE.venue)}</b></p>` : "") + SCHEDULE.days.map(d => `
    <section class="day"><h3>${e(d.date)}</h3>
    ${d.items.map(it => `<div class="item ${state.get(it) || ""}"><span class="t">${e(it.time || "")}</span>
      <span class="w">${e(it.what)}</span>${it.note ? `<span class="n">${e(it.note)}</span>` : ""}</div>`).join("")}
    </section>`).join("") +
    `<section class="tips"><h3>初めての方へ</h3><ul>${SCHEDULE.tips.map(t => `<li>${e(t)}</li>`).join("")}</ul></section>`;
  document.getElementById("sched").hidden = false;
}
document.getElementById("schedClose").onclick = () => {
  document.getElementById("sched").hidden = true;
  if (location.hash === "#nittei") history.replaceState(null, "", location.pathname + location.search);
};
document.getElementById("schedBtn").onclick = openSchedule;
document.getElementById("gateSched").onclick = openSchedule;
if (!SCHEDULE) { document.getElementById("schedBtn").hidden = true; document.getElementById("gateSched").hidden = true; }
if (location.hash === "#nittei") openSchedule();

if (location.hash === "#admin") {
  store.set("admin", "1");  // 管理者用から開いた端末として覚える
  history.replaceState(null, "", location.pathname + location.search);
}
if (PLAIN) {
  boot(PLAIN);
} else if (SEALED) {
  document.getElementById("gateQ").textContent = SEALED.question;
  if (SEALED.scope === "admin") {
    const a = document.getElementById("gateA");
    a.removeAttribute("inputmode"); a.setAttribute("autocapitalize", "off"); // 大文字小文字はどちらでもよい
    document.getElementById("gateSched").hidden = !SCHEDULE;
  }
  document.getElementById("gate").hidden = false;
  document.getElementById("gateForm").addEventListener("submit", e => {
    e.preventDefault(); tryOpen(document.getElementById("gateA").value);
  });
  const saved = store.get("answer");
  if (saved) tryOpen(saved, true);
}
</script>
